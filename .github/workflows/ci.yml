name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Линтеры и генерация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Установка sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Сгенерированный код актуален
        run: task gen:check
      - name: go vet и архитектурные тесты
        run: |
          go vet ./...
          go test ./tools/archtest/...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: Юнит-тесты (с детектором гонок)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Юнит-тесты
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt ./libs/... ./services/... ./tools/...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  integration:
    name: Интеграционные тесты (PostgreSQL и Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Интеграционные тесты
        run: go test -tags integration -count=1 -timeout 20m ./libs/... ./services/...

  contracts:
    name: Контракты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Примеры соответствуют схемам и Go-типам
        run: go test -count=1 ./libs/contracts/...
      - name: Обратная совместимость схем
        if: github.event_name == 'pull_request'
        run: go run ./tools/contracts-check --base origin/${{ github.base_ref }}

  security:
    name: Безопасность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy (файловая система)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Сборка бинарников и образов
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Бинарники
        run: task build
      - name: Образы
        run: task images
