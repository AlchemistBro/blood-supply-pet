name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README*.md", "**/README*.md", "CONTRIBUTING.md", "tools/docs-*/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"

jobs:
  lint:
    name: Линтеры и генерация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Установка sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Сгенерированный код актуален
        run: task gen:check
      - name: go vet и архитектурные тесты
        run: |
          go vet ./...
          go vet -tags integration,e2e ./... ./libs/testdata
          go run ./tools/authmatrix -check
          go test ./tools/archtest/...
      - name: Проверки инструментов восстановления
        run: |
          python3 -B -m unittest discover -s tools/k8sdrill -p 'test_*.py'
          python3 -B -m unittest discover -s tools/chaos -p 'test_*.py'
          python3 -B -m unittest discover -s tools/release -p 'test_*.py'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: ./... ./libs/testdata

  test:
    name: Юнит-тесты (с детектором гонок)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Юнит-тесты
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt ./libs/... ./libs/testdata ./services/... ./tools/...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  integration:
    name: Интеграционные тесты (PostgreSQL и Kafka)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Интеграционные тесты
        run: go test -tags integration -count=1 -timeout 20m ./libs/... ./services/...

  contracts:
    name: Контракты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Примеры соответствуют схемам и Go-типам
        run: go test -count=1 ./libs/contracts/...
      - name: Обратная совместимость схем
        if: github.event_name == 'pull_request'
        run: go run ./tools/contracts-check --base origin/${{ github.base_ref }}

  security:
    name: Безопасность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... ./libs/testdata
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: trivy (файловая система)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Собрать конфигурации для статической проверки
        run: |
          mkdir -p dist/security-config
          cp deploy/docker/Dockerfile dist/security-config/Dockerfile
          mkdir -p dist/security-config/minio
          cp deploy/docker/Minio.Dockerfile dist/security-config/minio/Dockerfile
          for overlay in local ci prod-example; do
            mkdir -p "dist/security-config/$overlay"
            kubectl kustomize "deploy/k8s/overlays/$overlay" -o "dist/security-config/$overlay"
          done
      - name: trivy (Dockerfile и полные манифесты Kubernetes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: dist/security-config
          severity: HIGH,CRITICAL
          format: json
          output: dist/trivy-config.json
          # Решение принимает следующий обязательный шаг; полный отчёт сохраняется.
          exit-code: "0"
      - name: Проверить границы исключений Trivy
        run: python3 -m unittest discover -s tools/security -p 'test_*.py'
      - name: Проверить все находки Trivy
        run: python3 tools/security/check_trivy_config.py dist/trivy-config.json dist/security-config
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config
          path: dist/trivy-config.json

  build:
    name: Сборка бинарников и образов
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Бинарники
        run: task build
      - name: Образы
        run: task images
      - name: Установить Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.1
          cache: true
      - name: Проверить все образы приложения
        run: |
          mkdir -p artifacts/trivy-images
          failed=0
          for service in audit inventory logistics-gateway transfer web demand planning matching notification sim-aist sim-emergency sim-logistics; do
            if ! trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "artifacts/trivy-images/$service.json" \
              "ghcr.io/alchemistbro/blood-supply-$service:dev"; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-images
          path: artifacts/trivy-images/
          if-no-files-found: ignore
