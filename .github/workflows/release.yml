name: Release
run-name: ${{ inputs.phase }} ${{ inputs.version }}

# No push trigger: candidates and promotion require explicit versioned dispatches.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version including v (for example v1.0.0)
        required: true
        type: string
      phase:
        description: Publish candidate digests or promote tested candidate to release
        required: true
        type: choice
        options: [candidate, promote]
      candidate_run_id:
        description: Successful candidate run ID (required for promote)
        required: false
        type: string
      k8s_run_id:
        description: Successful Kubernetes run with evidence bound to this candidate (required for promote)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      candidate_tag: ${{ steps.plan.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tools/release -p 'test_*.py' -v
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          PHASE: ${{ inputs.phase }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          K8S_RUN_ID: ${{ inputs.k8s_run_id }}
        run: python3 tools/release/release.py plan

  images:
    if: inputs.phase == 'candidate'
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ inputs.version }}
      candidate_tag: ${{ needs.prepare.outputs.candidate_tag }}
      matrix: ${{ needs.prepare.outputs.matrix }}

  candidate:
    if: inputs.phase == 'candidate'
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-image-*
          path: candidate
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Assemble digest manifest and sign complete evidence inventory
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/release/release.py assemble --version "$VERSION" --output candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 30

  promote:
    if: inputs.phase == 'promote'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubernetes-diagnostics
          run-id: ${{ inputs.k8s_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: k8s-evidence
      - name: Verify tested candidate, preserve digests, and promote version tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          K8S_RUN_ID: ${{ inputs.k8s_run_id }}
        run: >-
          python3 tools/release/release.py promote --version "$VERSION"
          --candidate-run-id "$CANDIDATE_RUN_ID" --k8s-run-id "$K8S_RUN_ID"
          --k8s-evidence k8s-evidence/dist/k8s-release-evidence.json --output candidate
      - name: Publish release only after all images and evidence pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" candidate/* --verify-tag --draft \
            --title "$VERSION" --notes-file candidate/notes.md
          gh release edit "$VERSION" --draft=false --latest
