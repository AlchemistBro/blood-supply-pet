name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Сквозные сценарии на стенде
    # На pull request запускается только с меткой e2e.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Поднять стенд
        run: task up
      - name: Сквозные тесты
        run: task test:e2e
      - name: Логи стенда при падении
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/.env --profile services logs --no-color --tail=300 > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose.log
      - name: Остановить стенд
        if: always()
        run: task down
