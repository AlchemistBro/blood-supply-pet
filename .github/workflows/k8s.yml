name: Kubernetes

on:
  workflow_dispatch:
    inputs:
      drill:
        description: Выполнить учебный отказ primary и PITR
        type: boolean
        default: false
      images_run_id:
        description: Candidate release run с images.json; пусто — сборка исходников
        type: string
        default: ""
      candidate_version:
        description: Версия кандидата образов
        type: string
        default: v1.0.0
      chaos:
        description: Выполнить отказы и проверить реальные алерты
        type: boolean
        default: true
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: "31 3 * * 0"

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'k8s')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BS_K8S_OVERLAY: ci
      BS_K8S_BUILD_IMAGES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Установить kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Освободить место для образов и архива PostgreSQL
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Загрузить точные образы кандидата
        if: inputs.images_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.candidate_version }}
          run-id: ${{ inputs.images_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/release
      - name: Доступ к приватным образам
        if: inputs.images_run_id != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Развернуть платформу и сервисы
        env:
          BS_K8S_RELEASE_MANIFEST: ${{ inputs.images_run_id != '' && 'dist/release/images.json' || '' }}
          BS_K8S_REGISTRY_CONFIG: ${{ inputs.images_run_id != '' && '/home/runner/.docker/config.json' || '' }}
        run: task k8s:up
      - name: Проверить готовность и права
        run: task k8s:smoke
      - name: Сценарии отказов и реальные алерты
        if: github.event_name == 'schedule' || inputs.chaos
        env:
          BS_CHAOS_EPHEMERAL: "1"
        run: task k8s:chaos
      - name: Выполнить учение PITR
        if: github.event_name == 'schedule' || inputs.drill
        run: task k8s:drill
      - name: Связать приёмку с точными образами кандидата
        if: inputs.images_run_id != ''
        env:
          IMAGES_RUN_ID: ${{ inputs.images_run_id }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: python3 tools/k8sdrill/evidence.py
      - name: Собрать диагностику
        if: always()
        run: |
          mkdir -p artifacts
          kubectl --context kind-blood-supply get pods -A -o wide > artifacts/pods.txt 2>&1 || true
          kubectl --context kind-blood-supply get events -A --sort-by=.lastTimestamp > artifacts/events.txt 2>&1 || true
          kubectl --context kind-blood-supply logs -n bs-app -l blood-supply.io/runtime=go-service --all-containers --prefix --max-log-requests=20 --tail=200 > artifacts/services.log 2>&1 || true
          kubectl --context kind-blood-supply describe nodes > artifacts/nodes.txt 2>&1 || true
          kubectl --context kind-blood-supply describe pods -n bs-data > artifacts/data-pods.txt 2>&1 || true
          kubectl --context kind-blood-supply logs -n bs-edge deployment/keycloak --tail=200 > artifacts/keycloak.log 2>&1 || true
          kubectl --context kind-blood-supply logs -n bs-data job/minio-setup --tail=100 > artifacts/minio-setup.log 2>&1 || true
          kubectl --context kind-blood-supply logs -n bs-data -l cnpg.io/cluster=pg --all-containers --prefix --tail=100 > artifacts/postgres.log 2>&1 || true
          kubectl --context kind-blood-supply get clusters,backups -n bs-data -o yaml > artifacts/database-status.yaml 2>&1 || true
          kubectl --context kind-blood-supply logs -n bs-data -l cnpg.io/cluster=pg-drill --all-containers --prefix --tail=200 > artifacts/restore.log 2>&1 || true
          kubectl --context kind-blood-supply logs -n bs-observability deployment/otel-lgtm --all-containers --tail=100 > artifacts/observability.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-diagnostics
          path: |
            artifacts/
            dist/k8s-startup.json
            dist/k8s-pod-metrics.json
            dist/k8s-hpa.json
            dist/k8s-readiness.json
            dist/k8s-release-evidence.json
            dist/drill-application.json
            dist/drill-saga.json
            docs/perf/drill-*.md
          if-no-files-found: ignore
