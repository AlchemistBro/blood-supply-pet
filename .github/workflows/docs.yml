name: Документация

on:
  pull_request:
    paths: ["docs/**", "README.md", "CONTRIBUTING.md"]
  push:
    branches: [main]
    paths: ["docs/**", "README.md", "CONTRIBUTING.md"]

permissions:
  contents: read

jobs:
  docs:
    name: Mermaid, ссылки, BPMN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка ссылок между документами
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          bad = []
          for md in list(root.glob('docs/**/*.md')) + [pathlib.Path('README.md'), pathlib.Path('CONTRIBUTING.md')]:
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'\]\((?!https?:|#|mailto:)([^)\s#]+)', text):
                  p = (md.parent / target).resolve()
                  if not p.exists():
                      bad.append(f'{md}: битая ссылка {target}')
          print('\n'.join(bad) or 'ссылки в порядке')
          sys.exit(1 if bad else 0)
          PY
      - name: Рендер Mermaid-диаграмм (проверка синтаксиса)
        run: |
          npm install --no-save @mermaid-js/mermaid-cli@11
          mkdir -p /tmp/mmd
          python3 - <<'PY'
          import re, pathlib
          n = 0
          for md in list(pathlib.Path('docs').rglob('*.md')) + [pathlib.Path('README.md')]:
              for i, block in enumerate(re.findall(r'```mermaid\n(.*?)```', md.read_text(encoding='utf-8'), re.S)):
                  pathlib.Path(f'/tmp/mmd/{n:03d}.mmd').write_text(block, encoding='utf-8'); n += 1
          print('диаграмм:', n)
          PY
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          for f in /tmp/mmd/*.mmd; do npx mmdc -p /tmp/puppeteer.json -i "$f" -o "${f%.mmd}.svg" || { echo "ошибка в $f"; cat "$f" | head -5; exit 1; }; done
      - name: Валидность BPMN XML
        run: |
          shopt -s nullglob
          for f in docs/architecture/diagrams/bpmn/*.bpmn; do python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$f" && echo "ok $f"; done
