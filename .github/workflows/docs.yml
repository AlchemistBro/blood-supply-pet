name: Документация

on:
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "README*.md", "CONTRIBUTING.md", "services/*/migrations/**", "libs/*/migrations/**", "tools/docs-*/**", "deploy/compose/keycloak/**", "Taskfile.yml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "README*.md", "CONTRIBUTING.md", "services/*/migrations/**", "libs/*/migrations/**", "tools/docs-*/**", "deploy/compose/keycloak/**", "Taskfile.yml", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  docs:
    name: Mermaid, ссылки, BPMN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сверка ER с Up-миграциями без подключения к БД
        run: python3 tools/docs-er/generate.py --check
      - name: Статическая сверка BPMN XML, ссылок и DI
        run: python3 tools/docs-diagrams/check-bpmn.py
      - name: Схемы C4 и UML для README совпадают с генератором
        run: |
          python3 tools/docs-diagrams/c4.py
          python3 tools/docs-diagrams/sequence.py
          git diff --exit-code -- docs/architecture/diagrams/c4 docs/architecture/diagrams/uml
      - name: Подписи схем C4 и UML не закрывают чужие линии
        run: python3 tools/docs-diagrams/check-labels.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка ссылок между документами
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('.')
          bad = []
          for md in list(root.glob('docs/**/*.md')) + [pathlib.Path('README.md'), pathlib.Path('CONTRIBUTING.md')]:
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'\]\((?!https?:|#|mailto:)([^)\s#]+)', text):
                  p = (md.parent / target).resolve()
                  if not p.exists():
                      bad.append(f'{md}: битая ссылка {target}')
          print('\n'.join(bad) or 'ссылки в порядке')
          sys.exit(1 if bad else 0)
          PY
      - name: Экспорт Mermaid и BPMN в SVG
        run: |
          npm install --no-save --package-lock=false @mermaid-js/mermaid-cli@11 bpmn-js@18.9.1
          python3 tools/docs-diagrams/extract.py
          node tools/docs-diagrams/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-svg
          path: |
            dist/diagrams/*.svg
            dist/diagrams/index.md
            dist/diagrams/manifest.json
          if-no-files-found: error
