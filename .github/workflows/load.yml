name: Нагрузка

on:
  workflow_dispatch:
  schedule:
    - cron: "13 4 * * 0"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: grafana/setup-k6-action@v1
      - name: Поднять синтетический стенд
        run: task up
      - name: Наполнить синтетическими данными
        run: task seed
      - name: Измерить NFR002
        run: |
          mkdir -p artifacts
          go test ./services/planning/internal/domain -run '^$' -bench '^BenchmarkBuildPlanNFR002$' -benchmem -count=1 | tee artifacts/plan-benchmark.txt
      - name: Измерить NFR003
        run: task load
      - name: Диагностика подготовки стенда и нагрузки
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/.env --profile services logs --no-color --tail=200 > artifacts/compose.log 2>&1 || true
          docker stats --no-stream > artifacts/docker-stats.txt 2>&1 || true
          df -h > artifacts/disk.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance
          path: |
            artifacts/
            tests/load/results/
          if-no-files-found: ignore
      - name: Остановить стенд
        if: always()
        run: task down
