name: Candidate images

# Publication is invoked only by the explicit candidate release operation.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      candidate_tag:
        required: true
        type: string
      matrix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          SERVICE: ${{ matrix.name }}
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY%%/*}/blood-supply-$SERVICE" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A Git context at a commit binds provenance to actual source material.
          context: https://github.com/${{ github.repository }}.git#${{ github.sha }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ inputs.version }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.candidate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max,version=v1,builder-id=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify image, SPDX SBOM, and BuildKit provenance
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.name }}
          VERSION: ${{ inputs.version }}
        run: >-
          python3 tools/release/release.py image
          --name "$SERVICE" --image "$IMAGE_NAME" --digest "$IMAGE_DIGEST"
          --version "$VERSION" --output candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-image-${{ matrix.name }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
