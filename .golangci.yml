version: "2"

run:
  timeout: 5m
  build-tags: [integration]

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - gocritic
    - exhaustive
    - depguard
    - bodyclose
    - noctx
    - errorlint
    - misspell
    - forbidigo
  settings:
    forbidigo:
      forbid:
        # Время только через libs/clock.Clock: сроки, таймеры и водяные знаки проверяются в тестах
        # подменой часов (CONTRIBUTING.md, правила кода). Область — services/*/internal, см. exclusions.
        - pattern: ^time\.Now$
          msg: "время только через libs/clock.Clock (CONTRIBUTING.md)"
        # Вывод только структурным журналом slog без ПДн; fmt.Print* допустим в tools, тестах и скриптах.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "вывод через slog (libs/observability), не fmt.Print*"
    depguard:
      rules:
        kafka-only-in-messaging:
          # Прямой клиент Kafka запрещён в бизнес-коде (ADR-0003): только через libs/messaging.
          list-mode: lax
          files:
            - "!**/libs/messaging/**"
            - "!**/libs/testinfra/**"
            - "!**/tools/**"
            - "!**/tests/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/twmb/franz-go
              desc: "Kafka только через libs/messaging (ADR-0003)"
        domain-is-pure:
          list-mode: lax
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: "домен не зависит от БД"
            - pkg: net/http
              desc: "домен не зависит от HTTP"
            - pkg: database/sql
              desc: "домен не зависит от БД"
    gosec:
      excludes:
        # G104 (непроверенная ошибка) дублирует errcheck, который включён и настроен строже.
        - G104
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    exhaustive:
      default-signifies-exhaustive: true
    errorlint:
      errorf: true
  exclusions:
    generated: lax
    paths:
      - ".*\\.gen\\.go$"
      - "internal/adapters/postgres/gen"
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, forbidigo]
      # Фальшивые серверы тестов выпускают токены и ставят сетевые дедлайны по системным часам.
      - path: /(?:oidctest|smtptest)/
        linters: [forbidigo]
        text: time\.Now
      # time.Now запрещён только в бизнес-коде сервисов; libs/clock (реализация Clock), измерение длительности
      # в libs/httpx и libs/messaging, тестовая инфраструктура и точки входа cmd остаются на системных часах.
      - path-except: ^services/[^/]+/internal/
        linters: [forbidigo]
        text: time\.Now
      # Генератор заготовки сервиса пишет в Taskfile.yml по корню, который разработчик сам передаёт флагом
      # --root: это инструмент разработчика в его рабочей копии, а не обработка внешнего ввода (ложное G703).
      - path: (^|/)tools/scaffold/
        linters: [gosec]
        text: G703
      # Генератор синтетических данных обязан быть детерминированным по сиду (ADR-0010): math/rand здесь
      # не для секретов (ложное G404). Каталог testdata Go не включает в ./..., линтуется явно.
      - path: (^|/)libs/testdata/
        linters: [gosec]
        text: G404
      # Командные утилиты и скрипты пишут результат в stdout для человека.
      - path: (^|/)(tools|tests|scripts)/
        linters: [forbidigo]
        text: fmt\.Print

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AlchemistBro/blood-supply-pet
  exclusions:
    generated: lax
