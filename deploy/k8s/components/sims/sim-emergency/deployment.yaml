# sim-emergency — имитатор C02: отправляет агрегированный прогноз ЧС в planning (ИНТ-02).
# BS_PLANNING_URL — база planning, путь /int/forecast имитатор добавляет сам. Служебный токен в имитаторе
# ещё не подключён: без него отправка отклоняется (BS_SIM_NO_AUTH=true — только локальная разработка).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-emergency
  namespace: bs-sims
  labels:
    app.kubernetes.io/name: sim-emergency
    app.kubernetes.io/component: simulator
    blood-supply.io/runtime: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sim-emergency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sim-emergency
        app.kubernetes.io/component: simulator
        blood-supply.io/runtime: go-service
      annotations:
        prometheus.io/port: "8202"
    spec:
      containers:
        - name: app
          image: ghcr.io/alchemistbro/blood-supply-sim-emergency:edge
          ports:
            - name: http
              containerPort: 8202
          env:
            - name: BS_HTTP_ADDR
              value: ":8202"
            - name: BS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sims-env
                  key: BS_LOG_LEVEL
            - name: BS_LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: sims-env
                  key: BS_LOG_FORMAT
            - name: BS_PLANNING_URL
              valueFrom:
                configMapKeyRef:
                  name: sims-env
                  key: BS_PLANNING_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
