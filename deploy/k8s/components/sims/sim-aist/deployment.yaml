# sim-aist — имитатор АИСТ-М (C01): единицы, статусы, снимок CSV, приём закреплений, управляемые сбои.
# Состояние в памяти: перезапуск пода начинает набор заново.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-aist
  namespace: bs-sims
  labels:
    app.kubernetes.io/name: sim-aist
    app.kubernetes.io/component: simulator
    blood-supply.io/runtime: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sim-aist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sim-aist
        app.kubernetes.io/component: simulator
        blood-supply.io/runtime: go-service
      annotations:
        prometheus.io/port: "8201"
    spec:
      containers:
        - name: app
          image: ghcr.io/alchemistbro/blood-supply-sim-aist:edge
          ports:
            - name: http
              containerPort: 8201
          env:
            - name: BS_HTTP_ADDR
              value: ":8201"
            - name: BS_ENV
              valueFrom:
                configMapKeyRef:
                  name: sims-env
                  key: BS_ENV
            - name: BS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sims-env
                  key: BS_LOG_LEVEL
            - name: BS_OTEL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sims-env
                  key: BS_OTEL_ENDPOINT
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
