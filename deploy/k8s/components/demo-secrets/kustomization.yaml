# ДЕМО-секреты для local и ci. Значения совпадают с deploy/compose (пароль роли равен её имени)
# и годятся только для стенда на ноутбуке и в CI. prod-example этот компонент не подключает.
#
# Хеш-суффикс отключён: на секреты ссылаются ресурсы CloudNativePG (Cluster.managed.roles,
# barmanObjectStore), а kustomize не умеет переписывать имена в чужих CRD.
# Метка cnpg.io/reload: оператор применяет смену пароля роли без перезапуска кластера.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

generatorOptions:
  disableNameSuffixHash: true
  labels:
    blood-supply.io/demo: "true"
  annotations:
    blood-supply.io/note: "демо-значения, не для реального развёртывания"

secretGenerator:
  # ---------------------------------------------------------------- bs-data: роли PostgreSQL
  - name: pg-role-inventory
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=inventory, password=inventory]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-demand
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=demand, password=demand]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-planning
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=planning, password=planning]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-matching
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=matching, password=matching]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-transfer
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=transfer, password=transfer]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-logistics
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=logistics, password=logistics]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-notification
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=notification, password=notification]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-audit
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=audit, password=audit]
    options:
      labels: { cnpg.io/reload: "true" }
  - name: pg-role-keycloak
    namespace: bs-data
    type: kubernetes.io/basic-auth
    literals: [username=keycloak, password=keycloak]
    options:
      labels: { cnpg.io/reload: "true" }

  # ---------------------------------------------------------------- bs-data: MinIO
  - name: minio-root
    namespace: bs-data
    literals:
      - MINIO_ROOT_USER=minio-admin
      - MINIO_ROOT_PASSWORD=minio-demo-password
  # Учётная запись CloudNativePG: доступ только к бакету pg-backups (создаёт Job minio-setup).
  - name: pg-backup-s3
    namespace: bs-data
    literals:
      - ACCESS_KEY_ID=pg-backup
      - ACCESS_SECRET_KEY=pg-backup-demo-password

  # ---------------------------------------------------------------- bs-edge: Keycloak
  - name: keycloak-admin
    namespace: bs-edge
    type: kubernetes.io/basic-auth
    literals: [username=admin, password=admin]
  # Тот же пароль, что у роли keycloak в pg-role-keycloak (bs-data): секрет не виден между namespace.
  - name: keycloak-db
    namespace: bs-edge
    type: kubernetes.io/basic-auth
    literals: [username=keycloak, password=keycloak]

  # ---------------------------------------------------------------- bs-app: сервисы
  # Строка подключения к своей базе. Пароль совпадает с pg-role-<роль> в bs-data.
  # TLS включён на сервере CloudNativePG; sslmode=require шифрует канал без проверки сертификата
  # (сертификат кластера выпускает CA оператора, в демо его не раздаём).
  - name: inventory-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://inventory:inventory@pg-rw.bs-data.svc:5432/inventory?sslmode=require
  - name: demand-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://demand:demand@pg-rw.bs-data.svc:5432/demand?sslmode=require
  - name: planning-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://planning:planning@pg-rw.bs-data.svc:5432/planning?sslmode=require
  - name: matching-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://matching:matching@pg-rw.bs-data.svc:5432/matching?sslmode=require
  - name: transfer-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://transfer:transfer@pg-rw.bs-data.svc:5432/transfer?sslmode=require
  - name: logistics-gateway-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://logistics:logistics@pg-rw.bs-data.svc:5432/logistics?sslmode=require
  - name: notification-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://notification:notification@pg-rw.bs-data.svc:5432/notification?sslmode=require
  - name: audit-db
    namespace: bs-app
    literals:
      - BS_DB_URL=postgres://audit:audit@pg-rw.bs-data.svc:5432/audit?sslmode=require
  # web: секрет клиента web из realm (deploy/compose/keycloak) и ключ шифрования cookie сессии
  # (32 байта в base64, AES-GCM, ADR-0018).
  - name: web-secrets
    namespace: bs-app
    literals:
      - BS_OIDC_CLIENT_SECRET=web-demo-secret
      - BS_SESSION_KEY=Ymxvb2Qtc3VwcGx5LWRlbW8tc2Vzc2lvbi1rZXktMzI=
  # Служебный клиент services (client credentials): web → audit (ADR-0017), transfer → inventory (ADR-0004).
  - name: service-client
    namespace: bs-app
    literals:
      - BS_SERVICE_CLIENT_ID=services
      - BS_SERVICE_CLIENT_SECRET=services-demo-secret
  # Ключи шифрования номера случая (K1, ADR-0020): только matching и inventory. Формат
  # «идентификатор:ключ в base64 (32 байта)», несколько ключей через запятую — для ротации.
  - name: k1-keys
    namespace: bs-app
    literals:
      - BS_K1_KEYS=demo-1:Ymxvb2Qtc3VwcGx5LWRlbW8tazEta2V5LTMyYnl0ZXM=
