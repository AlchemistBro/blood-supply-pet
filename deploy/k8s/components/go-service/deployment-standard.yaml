# Имя в патче не важно: цель выбирается по метке в kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
spec:
  revisionHistoryLimit: 3
  # Новый под сначала становится готовым (/readyz), потом гасится старый.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # Метрики: сервис шлёт их в OTel Collector (BS_OTEL_ENDPOINT) и отдаёт /metrics в формате
        # Prometheus. Аннотации — для сборщика по аннотациям; ServiceMonitor не используем (нет CRD).
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Переменные ссылок на сервисы (INVENTORY_PORT=tcp://…) сервисам не нужны.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          imagePullPolicy: IfNotPresent
          env:
            # Имя пода — для журналов, трасс и владельца аренды (transfer, logistics-gateway).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Пока идут миграции и сид справочников, сервис не отвечает: до 2 минут на старт.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          # /readyz — база и Kafka достижимы, миграции применены (deployment.md).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
