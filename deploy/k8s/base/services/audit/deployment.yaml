# audit — неизменяемый журнал с цепочкой хешей (NFR008, NFR016): читает audit.events, принимает записи web.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: bs-app
  labels:
    app.kubernetes.io/name: audit
    app.kubernetes.io/component: service
    blood-supply.io/runtime: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/component: service
        blood-supply.io/runtime: go-service
      annotations:
        prometheus.io/port: "8108"
    spec:
      containers:
        - name: app
          image: ghcr.io/alchemistbro/blood-supply-audit:edge
          ports:
            - name: http
              containerPort: 8108
          envFrom:
            - configMapRef:
                name: platform-env
          env:
            - name: BS_HTTP_ADDR
              value: ":8108"
            - name: BS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: audit-db
                  key: BS_DB_URL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
