# matching: HPA по CPU. Потребители Kafka в одной группе: выше числа партиций (3, topics.txt)
# лишние реплики простаивают, поэтому maxReplicas = 3. Если топик успел создать сам сервис
# (messaging.EnsureTopics, одна партиция) раньше Job kafka-topics, читает одна реплика, остальные в резерве.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching
  namespace: bs-app
  labels:
    app.kubernetes.io/name: matching
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
