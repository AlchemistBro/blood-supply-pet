# maxUnavailable: 1 — при одной реплике не блокирует обслуживание узла, при двух и более держит хотя бы одну.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transfer
  namespace: bs-app
  labels:
    app.kubernetes.io/name: transfer
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transfer
