# web: HPA по CPU (docs/tasks/08-kubernetes.md). Состояния нет, но web читает inventory.events для SSE:
# если чтение будет в общей группе потребителей, реплик выше трёх партиций топика (topics.txt) бесполезно,
# поэтому maxReplicas = 3.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: bs-app
  labels:
    app.kubernetes.io/name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
