# planning — план пополнения, реестр дефицита, защищённый объём; принимает прогноз ЧС (ИНТ-02) через ingress.
# Только общие переменные runtime; свои настройки сервиса уточнить при реализации.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planning
  namespace: bs-app
  labels:
    app.kubernetes.io/name: planning
    app.kubernetes.io/component: service
    blood-supply.io/runtime: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: planning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planning
        app.kubernetes.io/component: service
        blood-supply.io/runtime: go-service
      annotations:
        prometheus.io/port: "8103"
    spec:
      containers:
        - name: app
          image: ghcr.io/alchemistbro/blood-supply-planning:edge
          ports:
            - name: http
              containerPort: 8103
          envFrom:
            - configMapRef:
                name: platform-env
          env:
            - name: BS_HTTP_ADDR
              value: ":8103"
            - name: BS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: planning-db
                  key: BS_DB_URL
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
