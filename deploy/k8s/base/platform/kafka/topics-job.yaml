# Создание топиков из libs/contracts. Брокер запрещает автосоздание, поэтому топики появляются
# только здесь (сервисы при старте тоже вызывают messaging.EnsureTopics — для готовых топиков это no-op).
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: bs-app
  labels:
    app.kubernetes.io/name: kafka-topics
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          # В kafka-native нет JVM-утилит; kafka-topics.sh есть в JVM-образе той же версии.
          image: apache/kafka:3.9.1
          command: ["/bin/sh", "/config/create-topics.sh"]
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka.bs-app.svc:9092
            # kafka-run-class.sh создаёт каталог журналов; корень ФС только для чтения.
            - name: LOG_DIR
              value: /tmp/kafka-logs
            - name: KAFKA_HEAP_OPTS
              value: -Xms64m -Xmx256m
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kafka-topics
        - name: tmp
          emptyDir: {}
