# База на сервис (ADR-0005), владелец — одноимённая роль из Cluster.spec.managed.roles.
# databaseReclaimPolicy: retain — удаление объекта Database из манифестов не удаляет данные.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: inventory
  namespace: bs-data
spec:
  cluster:
    name: pg
  name: inventory
  owner: inventory
  ensure: present
  databaseReclaimPolicy: retain
---
