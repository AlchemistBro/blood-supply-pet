# Сегмент данных (bs-data): PostgreSQL через CloudNativePG и хранилище копий MinIO.
# Секреты (pg-role-*, pg-backup-s3, minio-root) — в components/demo-secrets или во внешнем менеджере.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - minio.yaml
  - minio-setup-job.yaml
  - postgres-cluster.yaml
  - postgres-databases.yaml
  - postgres-scheduled-backup.yaml
