# Подготовка MinIO для CloudNativePG: бакет pg-backups и отдельная учётная запись с доступом
# только к нему (кластер БД не получает root-ключи хранилища). Повторный запуск безопасен.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-setup
  namespace: bs-data
  labels:
    app.kubernetes.io/name: minio-setup
data:
  setup.sh: |
    #!/bin/sh
    set -eu
    export MC_CONFIG_DIR=/tmp/mc
    i=0
    until mc alias set bs http://minio.bs-data.svc:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
      i=$((i + 1))
      [ "$i" -ge 60 ] && { echo "MinIO не ответил за 5 минут" >&2; exit 1; }
      sleep 5
    done
    mc mb --ignore-existing bs/pg-backups
    mc version enable bs/pg-backups
    # create перезаписывает существующую политику; attach при повторе сообщает «уже привязана».
    mc admin policy create bs pg-backups-rw /config/policy.json
    mc admin user add bs "$BACKUP_ACCESS_KEY_ID" "$BACKUP_ACCESS_SECRET_KEY"
    mc admin policy attach bs pg-backups-rw --user "$BACKUP_ACCESS_KEY_ID" || true
    echo "бакет pg-backups и учётная запись копий готовы"
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::pg-backups"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::pg-backups/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: bs-data
  labels:
    app.kubernetes.io/name: minio-setup
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          # Тот же образ, что у сервера: в нём есть клиент mc.
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          command: ["/bin/sh", "/config/setup.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
            - name: BACKUP_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pg-backup-s3
                  key: ACCESS_KEY_ID
            - name: BACKUP_ACCESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pg-backup-s3
                  key: ACCESS_SECRET_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: minio-setup
        - name: tmp
          emptyDir: {}
