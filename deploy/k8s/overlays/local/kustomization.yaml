# Стенд в kind на ноутбуке: база, демо-секреты, имитаторы.
# Применение (task k8s:up): kubectl apply --server-side -k deploy/k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      blood-supply.io/env: local
    includeSelectors: false

resources:
  - ../../base

components:
  - ../../components/demo-secrets
  - ../../components/sims

configMapGenerator:
  - name: platform-env
    namespace: bs-app
    behavior: merge
    literals:
      - BS_ENV=local
  # Самоподписанный сертификат на localhost: HSTS закрепил бы его в браузере для всех приложений на localhost.
  - name: web-config
    namespace: bs-app
    behavior: merge
    literals:
      - BS_HSTS_MAX_AGE=0
      - BS_DEMO_ACCESS=true
