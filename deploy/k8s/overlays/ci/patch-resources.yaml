# Минимальные ресурсы платформы для CI.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bs-app
spec:
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests: { cpu: 10m, memory: 256Mi }
            limits: { memory: 768Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: bs-edge
spec:
  template:
    spec:
      containers:
        - name: keycloak
          resources:
            requests: { cpu: 10m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  namespace: bs-observability
spec:
  template:
    spec:
      containers:
        - name: otel-lgtm
          resources:
            requests: { cpu: 10m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: bs-data
spec:
  template:
    spec:
      containers:
        - name: minio
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: bs-data
spec:
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-lgtm-data
  namespace: bs-observability
spec:
  resources:
    requests:
      storage: 1Gi
