# kind в GitHub Actions: то же, что local, с урезанными ресурсами и томами (раннер — 2 vCPU, 7 ГБ).
# Два экземпляра PostgreSQL сохранены: на CI проверяется то же переключение и архив WAL, что локально.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      blood-supply.io/env: ci
    includeSelectors: false

resources:
  - ../../base

components:
  - ../../components/demo-secrets
  - ../../components/sims

configMapGenerator:
  - name: platform-env
    namespace: bs-app
    behavior: merge
    literals:
      - BS_ENV=ci
  - name: web-config
    namespace: bs-app
    behavior: merge
    literals:
      - BS_HSTS_MAX_AGE=0
      - BS_DEMO_ACCESS=true

patches:
  - path: patch-resources.yaml
  # Одна реплика на сервис с HPA: на раннере не хватит CPU на два экземпляра каждого.
  - target:
      group: autoscaling
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: pg
    patch: |-
      - op: replace
        path: /spec/resources
        value:
          requests: { cpu: 25m, memory: 256Mi }
          limits: { memory: 512Mi }
      - op: replace
        path: /spec/storage/size
        value: 1Gi
      - op: replace
        path: /spec/walStorage/size
        value: 1Gi
  # На 2-vCPU раннере часть CPU зарезервирована control plane, Calico и операторами.
  # Requests задают резерв, а не ограничение CPU: тестовые сервисы могут использовать свободный CPU.
  - target:
      kind: Deployment
      labelSelector: blood-supply.io/runtime=go-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
  - target:
      kind: Deployment
      name: ^(sim-aist|sim-emergency|sim-logistics|mailpit)$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
  - target:
      kind: StatefulSet
      name: kafka
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
