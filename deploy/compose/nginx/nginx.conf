# Единственный вход в стенд (сегмент доступа ПР4): TLS, лимиты, маршрутизация.
# Самоподписанный сертификат создаёт контейнер certs при старте (см. compose.yaml).
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;

  limit_req_zone $binary_remote_addr zone=forecast:10m rate=5r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 20m;
    resolver 127.0.0.11 valid=10s;

    # ИНТ-02: прогноз ЧС от C02 попадает только в planning (NFR010: белый список полей на входе).
    location = /api/int/forecast {
      limit_req zone=forecast burst=10 nodelay;
      set $planning http://planning:8080;
      rewrite ^ /int/forecast break;
      proxy_pass $planning;
    }

    # Keycloak в compose открыт напрямую на :8180 (значение iss в токенах). В Kubernetes его
    # публикует ingress; здесь отдельного пути /auth нет, чтобы issuer был один.

    # Веб-интерфейс (SSE требует отключённой буферизации).
    location / {
      set $web http://web:8080;
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
