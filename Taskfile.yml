version: "3"

# Все задачи работают в Git Bash на Windows и в Linux CI. Запуск: task <имя>; список: task --list.

vars:
  COMPOSE: docker compose -f deploy/compose/compose.yaml --env-file deploy/compose/.env
  SERVICES: audit inventory logistics-gateway transfer web demand planning matching notification
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds: [task --list]
    silent: true

  # ---------------------------------------------------------------- генерация и форматирование
  gen:
    desc: Сгенерировать код из OpenAPI (oapi-codegen) и SQL (sqlc)
    cmds:
      # Сервис без генерируемого сервера (web, имитаторы) не имеет api/oapi-codegen.yaml, сервис без базы
      # (scaffold --no-db) — каталога sqlc: такие шаги пропускаются, а не валят генерацию.
      - for: { var: SERVICES, split: " " }
        cmd: if [ -f services/{{.ITEM}}/api/oapi-codegen.yaml ]; then cd services/{{.ITEM}}/api && go tool oapi-codegen -config oapi-codegen.yaml openapi.yaml; fi
      - for: { var: SERVICES, split: " " }
        cmd: if [ -d services/{{.ITEM}}/sqlc ]; then cd services/{{.ITEM}}/sqlc && sqlc generate; fi

  gen:check:
    desc: Убедиться, что сгенерированный код актуален (нет незакоммиченного diff после gen)
    cmds:
      - task: gen
      - cmd: |
          git diff --exit-code -- '*.gen.go' 'services/*/internal/adapters/postgres/gen' \
            || { echo "Сгенерированный код устарел - выполните task gen и закоммитьте"; exit 1; }

  fmt:
    desc: Форматировать код (gofmt + goimports через golangci-lint)
    cmds:
      - golangci-lint fmt ./...

  lint:
    desc: Линтеры и архитектурные проверки
    cmds:
      # Каталоги testdata Go исключает из шаблона ./..., поэтому libs/testdata указан явно.
      - go vet ./... ./libs/testdata
      - golangci-lint run ./...
      - go test ./tools/archtest/...

  # ---------------------------------------------------------------- тесты
  test:
    desc: Юнит-тесты (с -race, если доступен cgo)
    cmds:
      - go test -count=1 ./... ./libs/testdata
      - task: test:race

  test:race:
    desc: Юнит-тесты с детектором гонок (нужен gcc; пропускается без него)
    cmds:
      - cmd: |
          if command -v gcc >/dev/null 2>&1; then
            CGO_ENABLED=1 go test -race -count=1 ./libs/... ./libs/testdata ./services/...
          else
            echo "gcc не найден: детектор гонок пропущен (в CI он включён)"
          fi
    silent: true

  test:integration:
    desc: Интеграционные тесты на реальных PostgreSQL и Kafka (Docker, testcontainers)
    cmds:
      - go test -tags integration -count=1 -timeout 15m ./libs/... ./services/...

  test:postgres:
    desc: Проверки через внешний BS_TEST_DB_URL без запуска Docker; Kafka пропускается без внешнего брокера
    env:
      BS_TEST_NO_DOCKER: "true"
    cmds:
      - go test -tags integration -count=1 -p 2 -parallel 2 -timeout 25m ./libs/... ./services/...

  test:fitness:
    desc: Фитнес-тесты саги (гонки, дубли, kill шлюза); падение любого валит задачу
    cmds:
      - go test -tags integration -count=1 -timeout 15m -run 'Fitness|Race|Saga' ./services/...

  test:e2e:
    desc: Сквозные сценарии против поднятого стенда (task up)
    cmds:
      - go test -tags e2e -count=1 -timeout 10m ./tests/e2e/...

  contracts:check:
    desc: Проверка контрактов - примеры по схемам и обратная совместимость
    cmds:
      - go test -count=1 ./libs/contracts/...
      - go run ./tools/contracts-check --base origin/main

  # ---------------------------------------------------------------- сборка
  build:
    desc: Собрать бинарники сервисов в bin/
    cmds:
      - for: { var: SERVICES, split: " " }
        cmd: go build -trimpath -ldflags "-s -w -X github.com/AlchemistBro/blood-supply-pet/libs/runtime.Version={{.VERSION}}" -o bin/{{.ITEM}}{{exeExt}} ./services/{{.ITEM}}/cmd/{{.ITEM}}

  images:
    desc: Собрать Docker-образы всех сервисов
    cmds:
      - for: { var: SERVICES, split: " " }
        cmd: docker build -f deploy/docker/Dockerfile --build-arg SERVICE={{.ITEM}} --build-arg VERSION={{.VERSION}} -t ghcr.io/alchemistbro/blood-supply-{{.ITEM}}:dev .

  # ---------------------------------------------------------------- стенд
  up:
    desc: Поднять стенд - платформа и сервисы (docker compose)
    deps: [env]
    cmds:
      - "{{.COMPOSE}} --profile services up -d --build --wait"
      - 'echo "Стенд поднят. Keycloak: http://localhost:8180  Grafana: http://localhost:3000  Почта: http://localhost:8025"'

  up:platform:
    desc: Поднять только платформу (PostgreSQL, Kafka, Keycloak, наблюдаемость) для разработки сервисов локально
    deps: [env]
    cmds:
      - "{{.COMPOSE}} up -d --wait"

  down:
    desc: Остановить стенд и удалить тома
    cmds:
      - "{{.COMPOSE}} --profile services --profile ui down -v --remove-orphans"

  logs:
    desc: Логи стенда (task logs -- audit)
    cmds:
      - "{{.COMPOSE}} --profile services logs -f --tail=100 {{.CLI_ARGS}}"

  env:
    desc: Создать deploy/compose/.env из примера, если его нет
    status:
      - test -f deploy/compose/.env
    cmds:
      - cp deploy/compose/.env.example deploy/compose/.env

  dev:*:
    desc: Запустить сервис локально против платформы из compose (task dev:audit)
    vars:
      SVC: "{{index .MATCH 0}}"
      SERVICE_DB: '{{if eq .SVC "logistics-gateway"}}logistics{{else}}{{.SVC}}{{end}}'
      SERVICE_PORT: '{{index (dict "web" "8080" "inventory" "8101" "demand" "8102" "planning" "8103" "matching" "8104" "transfer" "8105" "logistics-gateway" "8106" "notification" "8107" "audit" "8108" "sim-aist" "8201" "sim-emergency" "8202" "sim-logistics" "8203") .SVC}}'
      SERVICE_K1: '{{if or (eq .SVC "inventory") (eq .SVC "matching")}}demo1:ZGVtby1rMS1rZXktbm90LWZvci1wcm9kdWN0aW9uISE={{end}}' # gitleaks:allow (демо-ключ)
    env:
      BS_HTTP_ADDR: ":{{.SERVICE_PORT}}"
      BS_DB_URL: "postgres://{{.SERVICE_DB}}:{{.SERVICE_DB}}@localhost:5433/{{.SERVICE_DB}}?sslmode=disable"
      BS_ENV: local
      BS_K1_KEYS: "{{.SERVICE_K1}}"
      BS_INVENTORY_URL: http://localhost:8101
      BS_DEMAND_URL: http://localhost:8102
      BS_PLANNING_URL: http://localhost:8103
      BS_MATCHING_URL: http://localhost:8104
      BS_TRANSFER_URL: http://localhost:8105
      BS_LOGISTICS_URL: http://localhost:8106
      BS_NOTIFICATION_URL: http://localhost:8107
      BS_AUDIT_URL: http://localhost:8108
      BS_AIST_URL: http://localhost:8201
      BS_C03_URL: http://localhost:8203
      BS_WEB_PUBLIC_URL: http://localhost:8080
      BS_OIDC_CLIENT_SECRET: web-demo-secret
      BS_SESSION_KEY: /SOEjDxUt7nj0eKQL+i7zzr82TvK/a2fNw4TZh596RU=
      BS_COOKIE_SECURE: "false"
      BS_HSTS_MAX_AGE: "0"
      BS_SERVICE_CLIENT_SECRET: services-demo-secret
      BS_KAFKA_BROKERS: "localhost:9092"
      BS_OIDC_ISSUER: "http://localhost:8180/realms/blood-supply"
      BS_OTEL_ENDPOINT: "localhost:4318"
      BS_LOG_FORMAT: text
    cmds:
      - go run ./services/{{.SVC}}/cmd/{{.SVC}}

  # ---------------------------------------------------------------- прочее
  docs:diagrams:
    desc: Экспортировать Mermaid и BPMN в dist/diagrams (Node.js, npm и Chromium; без запуска приложения)
    cmds:
      - npm install --no-save --package-lock=false @mermaid-js/mermaid-cli@11 bpmn-js@18.9.1
      - python tools/docs-diagrams/extract.py
      - node tools/docs-diagrams/render.mjs

  docs:er:
    desc: Обновить ER восьми баз из Up-миграций без подключения к PostgreSQL
    cmds: [python tools/docs-er/generate.py]

  docs:er:check:
    desc: Сверить сохранённые ER с миграциями без исполнения SQL
    cmds: [python tools/docs-er/generate.py --check]

  audit:verify:
    desc: Проверить цепочку хешей журнала аудита на поднятом стенде
    cmds:
      - go run ./tools/auditverify

  bench:plan:
    desc: Измерить NFR002 (100 клиник, 100000 единиц); требует разрешённого запуска тестовых бинарников
    cmds:
      - go test ./services/planning/internal/domain -run '^$' -bench '^BenchmarkBuildPlanNFR002$' -benchmem -count=1

  load:
    desc: Нагрузка 50 пользователей на отдельном синтетическом стенде (k6, создаёт демо-заявки)
    env:
      BS_LOAD_SYNTHETIC_ONLY: "1"
      BS_LOAD_INSECURE_TLS: "1"
    cmds:
      - mkdir -p tests/load/results
      - k6 run tests/load/roles.js

  chaos:
    desc: Сценарии отказов и конкуренции только на отдельном compose-стенде
    cmds: [bash tests/chaos/run.sh]

  planning:rebuild:
    desc: Восстановить проекции planning из локального журнала (BS_DB_URL базы planning)
    cmds:
      - go run ./services/planning/cmd/planning-rebuild

  seed:
    desc: Наполнить отдельный синтетический compose-стенд через HTTP API
    cmds: [go run ./tools/seed]

  seed:kind:
    desc: Наполнить синтетический kind через временные port-forward (без записи в чужие базы)
    cmds: [bash deploy/k8s/seed.sh]

  k8s:up:
    desc: Собрать образы и поднять выделенный kind blood-supply (требует Docker)
    cmds: [bash deploy/k8s/up.sh]

  k8s:down:
    desc: Удалить только выделенный kind-кластер blood-supply и его данные
    cmds: [kind delete cluster --name blood-supply]

  k8s:smoke:
    desc: Проверить готовность, вход и отказ чужой роли в kind blood-supply
    cmds: [bash deploy/k8s/smoke.sh]

  k8s:network-check:
    desc: Проверить фактическое исполнение NetworkPolicy в kind blood-supply
    cmds: [bash deploy/k8s/network-check.sh]

  k8s:drill:
    desc: Учение PITR только в демо-kind, с отказом primary и отдельной восстановленной копией
    cmds: [bash deploy/k8s/drill/drill.sh]

  k8s:logs:
    desc: Логи сервисов выделенного kind-кластера
    cmds: [kubectl --context kind-blood-supply logs -n bs-app -l blood-supply.io/runtime=go-service --all-containers --prefix --max-log-requests=20 --tail=100]

  authmatrix:
    desc: Проверить x-bs-operation в контрактах и актуальность docs/architecture/auth-matrix.md (NFR011)
    cmds:
      - go run ./tools/authmatrix -check

  authmatrix:gen:
    desc: Перегенерировать таблицу прав docs/architecture/auth-matrix.md
    cmds:
      - go run ./tools/authmatrix -out docs/architecture/auth-matrix.md

  ci:
    desc: Всё, что делает GitHub Actions, локально
    cmds:
      - task: gen:check
      - task: lint
      - task: authmatrix
      - task: test
      - task: test:integration
      - task: contracts:check
      - task: build
