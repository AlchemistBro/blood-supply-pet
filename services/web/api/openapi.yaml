openapi: 3.0.3
info:
  title: web
  version: 0.1.0
  description: |
    Интерфейс и BFF (ADR-0007, ADR-0018). Страницы отдаются HTML; вход через Keycloak (authorization code + PKCE),
    сессия в зашифрованной cookie, каждый POST несёт CSRF-токен (поле csrf_token или заголовок X-CSRF-Token).
    Маршруты входа публичные и операций матрицы прав не имеют; экраны ролей описываются вместе с их операциями.
    Главная и выход не требуют операции роли (x-bs-public), но требуют сессии; выход также требует CSRF.
servers:
  - url: http://localhost:8080
paths:
  /demand:
    get:
      operationId: demandPage
      x-bs-operation: VIEW_DEMAND
      summary: Файлы статистики и версии потребности территории
      responses:
        "200": { description: Экран аналитика или просмотра дежурного }
  /demand/files:
    post:
      operationId: uploadDemandFile
      x-bs-operation: UPLOAD_STATISTICS
      summary: Загрузка CSV с csrf_token, без JavaScript
      responses:
        "200": { description: Результат и построчные ошибки }
  /demand/estimates:
    post:
      operationId: calculateDemand
      x-bs-operation: PUBLISH_ESTIMATE
      summary: Расчёт оценки по выбранным файлам и периодам
      responses:
        "303": { description: Переход к рассчитанной версии }
  /demand/estimates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: demandEstimate
      x-bs-operation: VIEW_DEMAND
      summary: Версия потребности с входами и строками клиник
      responses:
        "200": { description: Оценка }
  /demand/estimates/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: publishDemand
      x-bs-operation: PUBLISH_ESTIMATE
      summary: Подтверждение публикации аналитиком
      responses:
        "303": { description: Переход к опубликованной версии }
  /stock:
    get:
      operationId: stockPage
      x-bs-operation: VIEW_STOCK
      summary: Запас клиники, норматив и предупреждение ниже порога
      responses:
        "200": { description: Экран запаса }
  /stock/units:
    get:
      operationId: stockUnits
      x-bs-operation: VIEW_STOCK
      summary: Единицы FEFO с фильтрами по виду и группе
      responses:
        "200": { description: Экран единиц }
  /stock/units/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: stockUnit
      x-bs-operation: VIEW_STOCK
      summary: Карточка единицы и история статусов без исходного кода АИСТ-М и фенотипа
      responses:
        "200": { description: Карточка единицы }
  /stock/sync:
    post:
      operationId: syncStock
      x-bs-operation: SYNC_ON_DEMAND
      summary: Обновление из АИСТ-М формой с csrf_token и clinic
      responses:
        "200": { description: Результат обновления }
  /stock/annual-consumption:
    post:
      operationId: setConsumption
      x-bs-operation: ENTER_ANNUAL_CONSUMPTION
      summary: Ввод годового расхода и расчёт демонстрационного норматива
      responses:
        "200": { description: Норматив сохранён }
  /tasks:
    get:
      operationId: taskList
      x-bs-operation: VIEW_TASKS
      summary: Задания клиники-источника с фильтром статуса
      responses:
        "200": { description: Список заданий, content: { text/html: { schema: { type: string } } } }
  /tasks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: taskCard
      x-bs-operation: VIEW_OBLIGATION
      summary: Карточка задания, единицы FEFO и история; без фенотипа
      responses:
        "200": { description: Карточка задания, content: { text/html: { schema: { type: string } } } }
  /tasks/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: confirmTask
      x-bs-operation: CONFIRM_TRANSFER
      summary: Подтверждение формой без JavaScript (csrf_token, unit_ids, idempotency_key, accept_partial)
      responses:
        "200": { description: Результат подтверждения }
        "409": { description: Состояние задания или единиц изменилось }
        "422": { description: Недопустимый выбор или защищённый объём }
        "503": { description: Источник временно недоступен }
  /tasks/{id}/replace:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: replaceTask
      x-bs-operation: REPLACE_UNIT
      summary: Замена формой без JavaScript (csrf_token, old_unit_id, new_unit_id)
      responses:
        "200": { description: Результат замены }
        "409": { description: Замена недопустима в текущем состоянии }
        "422": { description: Единица не соответствует спецификации }
        "503": { description: Источник временно недоступен }
  /tasks/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectTask
      x-bs-operation: REJECT_TRANSFER
      summary: Отказ источника формой (csrf_token, reason=SOURCE_REFUSED)
      responses:
        "200": { description: Результат отказа }
  /login:
    get:
      operationId: loginPage
      x-bs-public: true
      summary: Страница входа с блоком «Демо-доступ»
      parameters:
        - { name: next, in: query, description: Локальный путь возврата после входа, schema: { type: string, maxLength: 512 } }
      responses:
        "200": { description: Страница входа, content: { text/html: { schema: { type: string } } } }
  /auth/login:
    get:
      operationId: startLogin
      x-bs-public: true
      summary: Переход в Keycloak (state, nonce, PKCE S256 в cookie bs_auth на 10 минут)
      parameters:
        - { name: hint, in: query, description: login_hint для Keycloak (логин демо-пользователя), schema: { type: string, pattern: "^[a-z0-9._-]{1,64}$" } }
        - { name: next, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { description: Переход на authorization endpoint Keycloak }
  /auth/callback:
    get:
      operationId: loginCallback
      x-bs-public: true
      summary: Возврат из Keycloak; проверка state и nonce, создание сессии, LOGIN в аудит
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: Вход выполнен, переход на адрес возврата }
        "400": { description: Вход не выполнен (state, nonce, ошибка провайдера), content: { text/html: { schema: { type: string } } } }
  /logout:
    post:
      operationId: logout
      x-bs-public: true
      summary: Выход - LOGOUT в аудит, удаление cookie, end-session Keycloak
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token]
              properties:
                csrf_token: { type: string }
      responses:
        "303": { description: Переход на end-session Keycloak }
        "403": { description: Нет CSRF-токена или он не совпал }
  /events/obligations:
    get:
      operationId: obligationEvents
      x-bs-operation: VIEW_OBLIGATION
      summary: Живые статусы обязательств (SSE) - фрагменты HTML для sse-swap, событие obligation-<id>
      description: |
        Клиника из параметра должна совпадать с клиникой токена (дежурный - любая); без параметра - клиника
        токена, у дежурного - все. Пульс - комментарий каждые 15 с. Во фрагментах нет номера случая и фенотипа.
      parameters:
        - { name: clinic, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: Поток событий, content: { text/event-stream: { schema: { type: string } } } }
        "400": { description: Неверный номер клиники }
        "403": { description: Нет права VIEW_OBLIGATION или чужая клиника }
  /:
    get:
      operationId: home
      x-bs-public: true
      summary: Главная после входа
      responses:
        "200": { description: Страница, content: { text/html: { schema: { type: string } } } }
        "303": { description: Нет сессии - переход на /login }
